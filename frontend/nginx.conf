# Mesmo roteamento do vercel.json: /api vai para o backend e o resto é o app (SPA)
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    # O backend usa o X-Forwarded-Host para montar o retorno do login do Instagram
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /privacidade { try_files /privacidade.html =404; }
  location = /exclusao-de-dados { try_files /exclusao-de-dados.html =404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
