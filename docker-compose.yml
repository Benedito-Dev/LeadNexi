services:
  postgres:
    image: postgres:17-alpine
    container_name: leadnexi-postgres
    environment:
      POSTGRES_USER: leadnexi
      POSTGRES_PASSWORD: leadnexi
      POSTGRES_DB: leadnexi
    ports:
      - "5435:5432"
    volumes:
      - leadnexi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadnexi -d leadnexi"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Ponte do WhatsApp não oficial (Evolution API), só com `docker compose --profile whatsapp up -d`.
  # Guarda a sessão no banco "evolution" do mesmo Postgres. Em produção ela roda numa VPS.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: leadnexi-evolution
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-leadnexi-evolution-local}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://leadnexi:leadnexi@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: leadnexi
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR,WARN
    ports:
      - "8081:8080"
    volumes:
      - leadnexi-evolution:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    # Os Dockerfiles ficam em docker/: dentro de frontend/ ou backend/ a Vercel os confunde com o
    # framework do serviço ("Multiple frameworks detected") e o deploy falha.
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: leadnexi-backend
    env_file: ./backend/.env
    environment:
      # Dentro da rede do compose o banco é o serviço "postgres", não o localhost
      DATABASE_URL: postgresql://leadnexi:leadnexi@postgres:5432/leadnexi?schema=public
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: leadnexi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  leadnexi-pgdata:
  leadnexi-evolution:
